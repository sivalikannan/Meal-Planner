<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MealPlan</title>
    <meta name="description" content="Admin dashboard for managing MealPlan bookings.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Shared + Admin Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" style="text-decoration: none;">
                <h1 class="logo">Meal<span>Plan</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">← Back to Site</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===== PASSWORD GATE ===== -->
    <div id="login-gate" class="login-gate">
        <div class="login-card">
            <div class="login-icon">🔒</div>
            <h2>Admin Access</h2>
            <p>Enter the admin password to view bookings.</p>
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="Enter password" required>
                </div>
                <div id="login-error" class="login-error hidden"></div>
                <button type="submit" class="btn btn-block" id="login-btn">Unlock Dashboard</button>
            </form>
        </div>
    </div>

    <!-- ===== ADMIN DASHBOARD (hidden until login) ===== -->
    <div id="admin-dashboard" class="admin-dashboard hidden">
        <!-- Stats Row -->
        <div class="container">
            <div class="dashboard-header">
                <h2 class="section-title" style="margin-bottom:10px;">📊 Booking Dashboard</h2>
                <button class="btn btn-outline" id="logout-btn">🔓 Lock Dashboard</button>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-number" id="stat-total">0</span>
                    <span class="stat-label">Total Bookings</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="stat-basic">0</span>
                    <span class="stat-label">Basic Plan</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="stat-healthy">0</span>
                    <span class="stat-label">Healthy Plan</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="stat-choice">0</span>
                    <span class="stat-label">Choice Plan</span>
                </div>
            </div>

            <!-- Search & Filter -->
            <div class="controls-row">
                <input type="text" id="search-input" class="search-input" placeholder="🔍  Search by name, phone, or plan...">
                <select id="filter-plan" class="filter-select">
                    <option value="all">All Plans</option>
                    <option value="Basic Plan">Basic Plan</option>
                    <option value="Healthy Plan">Healthy Plan</option>
                    <option value="Choice Plan">Choice Plan</option>
                </select>
            </div>

            <!-- Bookings Table -->
            <div class="table-wrapper">
                <table class="bookings-table" id="bookings-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Plan</th>
                            <th>Price</th>
                            <th>Meal Pref</th>
                            <th>Start Date</th>
                            <th>Status</th>
                            <th>Booked On</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-body">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state hidden">
                    <span class="empty-icon">📭</span>
                    <p>No bookings found.</p>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading bookings…</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>

</html>
